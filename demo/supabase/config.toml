# Local stack for the demo app. Only what differs from the CLI defaults is set here;
# the CLI fills every other key.
# Every port is the Supabase default + 2000, so this stack can run alongside other local stacks.
project_id = "supabase-rescue"

[api]
port = 56321

[db]
port = 56322
shadow_port = 56320

[db.pooler]
port = 56329

[studio]
port = 56323

[local_smtp]
port = 56324
smtp_port = 56325
pop3_port = 56326

[edge_runtime]
inspector_port = 10083

[analytics]
port = 56327
vector_port = 56328

[auth]
site_url = "http://localhost:7173"
additional_redirect_urls = ["http://localhost:7173/reset-password"]

[auth.email]
# Fixed (check e): on, so nobody can sign up with an email address they do not own.
enable_confirmations = true

[auth.email.smtp]
# Fixed (check i): auth emails go through Resend's SMTP server, not Supabase's built-in
# email service, which sends about 2 emails an hour and only to the project's own team.
# The local stack uses this too, so its auth emails do not reach the mail viewer.
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@juniperandash.example"
sender_name = "Juniper & Ash Hair Studio"

[functions.stripe-webhook]
# Stripe sends no Supabase token; the function checks Stripe's signature instead.
verify_jwt = false
